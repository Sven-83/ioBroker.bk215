version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # @types/node follows the minimum supported Node.js version, not the latest
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 ships without a compiler API; typescript-eslint (via @iobroker/eslint-config)
      # and ts-node (mocha tests) cannot run on it yet. Re-evaluate once typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      typescript-tooling:
        patterns:
          - "typescript"
          - "@types/*"
          - "ts-node"
      iobroker-tooling:
        patterns:
          - "@iobroker/*"
      test-tooling:
        patterns:
          - "mocha"
          - "chai"
          - "sinon*"
          - "@types/mocha"
          - "@types/chai*"
          - "@types/sinon*"
          - "proxyquire"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "github-actions"
